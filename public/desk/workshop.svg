      <circle cx="4.5" cy="-72" r="1.7" fill="#1E1B18" />
      <circle cx="-8.5" cy="-67.5" r="2.2" fill="#E07A5F" opacity=".55" />
      <circle cx="8.5" cy="-67.5" r="2.2" fill="#E07A5F" opacity=".55" />
      <path d="M-3 -66.5 Q0 -64 3 -66.5" stroke="#1E1B18" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>
