      <ellipse cx="9" cy="-1.5" rx="7" ry="3.5" fill="#1E1B18" />
      <path class="o" d="M-15 -60 Q0 -64 15 -60 L18 -20 Q0 -17 -18 -20 Z" />
      <path d="M-6 -61 L-3 -21 M6 -61 L3 -21" stroke="#FBF7EF" stroke-width="3" fill="none" />
