<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 500" role="img" aria-label="Cutaway of a little Japanese workshop where craftspeople build data systems">
  <style>
    .o { stroke: #1E1B18; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .thin { stroke: #1E1B18; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .arm-o { fill: none; stroke: #1E1B18; stroke-width: 9; stroke-linecap: round; }
    .arm { fill: none; stroke: #2C3E63; stroke-width: 5.5; stroke-linecap: round; }
    .arm.v { stroke: #D24429; }
    .hand { fill: #E8B48A; stroke: #1E1B18; stroke-width: 1.5; }
    .cab-o { fill: none; stroke: #1E1B18; stroke-width: 5.5; stroke-linecap: round; }
    .cab { fill: none; stroke-width: 3; stroke-linecap: round; }
    .pipe-o { fill: none; stroke: #1E1B18; stroke-width: 20; }
    .pipe { fill: none; stroke: #5E8C5A; stroke-width: 15; }

    @keyframes drip { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(46px); opacity: 0 } }
    .drip { animation: drip 1.6s ease-in infinite; }
    @keyframes rise { 0% { transform: translate(0, 0) scale(.6); opacity: 0 } 25% { opacity: 1 } 100% { transform: translate(6px, -34px) scale(1.2); opacity: 0 } }
    .puff { animation: rise 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes wisp { 0%, 100% { opacity: .2; transform: translateY(2px) } 50% { opacity: .9; transform: translateY(-3px) } }
    .wisp { animation: wisp 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .25 } }
    .led { animation: blink 1.1s steps(1) infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
    .lantern { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
    @keyframes tail { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(14deg) } }
    .tail { animation: tail 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 0; }
    @keyframes zz { 0% { transform: translate(0, 0); opacity: 0 } 30% { opacity: 1 } 100% { transform: translate(-8px, -18px); opacity: 0 } }
    .z { animation: zz 3s ease-out infinite; }
    @keyframes plane { 0%, 100% { transform: translateX(-5px) } 50% { transform: translateX(5px) } }
    .planing { animation: plane 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

